name: Existing Telegram bot pet news digest
on:
  pull_request:
    paths:
      - 'server/pet-news-*'
      - 'server/telegram-login-poller.js'
      - '.github/workflows/pet-news-existing-bot.yml'
  push:
    paths:
      - 'server/pet-news-*'
      - 'server/telegram-login-poller.js'
      - '.github/workflows/pet-news-existing-bot.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check server/pet-news-digest.js && node --check server/pet-news-worker.js && node --check server/pet-news-worker-runner.js && node --check server/pet-news-worker.test.js && node --check server/telegram-login-poller.js
      - name: News and Telegram menu regression tests
        run: node --test --test-concurrency=1 server/pet-news-digest.test.js server/pet-news-worker.test.js server/telegram-command-menu.test.js
