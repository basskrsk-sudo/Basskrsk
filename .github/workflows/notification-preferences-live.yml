name: Temporary personal notifications live verification

on:
  pull_request:
    paths:
      - .github/workflows/notification-preferences-live.yml

permissions:
  contents: read

jobs:
  verify-amvera:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed settings and secure private API without sending notifications
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          import urllib.error

          base='https://xn--80adktilqfjfx.xn--p1ai'
          checks=[
            ('/miniapp.html',['notification-settings.js','notification-settings.css']),
            ('/notification-settings.js',['Настройки уведомлений','/api/me/notifications','installFull']),
            ('/notification-settings.css',['hm-notify-row','hm-notify-overlay']),
            ('/miniapp-work.js',['data-work-action="notifications"','openNotificationSettings','selectedRole === \'salon\'']),
            ('/miniapp-customer.js',["action('notifications'","dataset.customerAction === 'notifications'"]),
            ('/taiga-groomer.html',['installFull("partner")']),
            ('/taiga-owner.html',['installFull("owner")']),
            ('/taiga-manager.html',['installFull("manager")']),
            ('/taiga-admin.html',['installFull("admin")']),
            ('/taiga-warehouse.html',['installFull("warehouse"']),
            ('/p.html',['/api/create-payment','Возьмите товар с полки']),
          ]
          for attempt in range(1,11):
            issues=[]
            for path,expected in checks:
              try:
                req=urllib.request.Request(
                  base+path+'?hvost-notify-check=release-'+str(attempt),
                  headers={'Cache-Control':'no-cache','User-Agent':'HvostMarket-PersonalNotifications-Live/2026-11-01'})
                with urllib.request.urlopen(req,timeout=16) as response:
                  data=response.read(2000000).decode('utf-8')
                  missing=[term for term in expected if term not in data]
                  if response.status!=200 or missing:
                    issues.append((path,'HTTP '+str(response.status)+' missing '+str(missing)))
              except Exception as exc:issues.append((path,str(exc)[:120]))

            for method in ('GET','PUT'):
              try:
                req=urllib.request.Request(base+'/api/me/notifications',
                  method=method,
                  headers={'Content-Type':'application/json','User-Agent':'HvostMarket-PersonalNotifications-Live/2026-11-01'},
                  data=b'{"settings":{"sales":true}}' if method=='PUT' else None)
                with urllib.request.urlopen(req,timeout=16) as response:
                  issues.append(('API '+method,'UNAUTHENTICATED ACCESS ALLOWED '+str(response.status)))
              except urllib.error.HTTPError as exc:
                if exc.code != 401:issues.append(('API '+method,'expected 401, got '+str(exc.code)))
              except Exception as exc:issues.append(('API '+method,str(exc)[:140]))
            if not issues:
              print('PASS: customer and every staff/founder Mini App notification settings LIVE',flush=True)
              print('PASS: full owner, groomer, manager, admin and warehouse settings linked',flush=True)
              print('PASS: unauthenticated notification GET/PUT rejected with HTTP 401',flush=True)
              print('PASS: quick QR checkout remains online',flush=True)
              print('READ ONLY: no account changes, no orders, no messages sent',flush=True)
              break
            print('Attempt',attempt,'not ready:',issues,flush=True)
            if attempt<10:time.sleep(8)
          else:raise SystemExit('FAIL: Amvera has not delivered new notification preferences release')
          PY
