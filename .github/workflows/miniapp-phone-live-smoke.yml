name: Temporary live Telegram phone login smoke check

on:
  pull_request:
    paths:
      - .github/workflows/miniapp-phone-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live phone-login assets and unauthenticated rejections
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error

          root = "https://xn--80adktilqfjfx.xn--p1ai"
          get_checks = [
              ("/miniapp.html", ("miniapp-identity.js", "miniapp-customer.js"), "Telegram Mini App main page"),
              ("/miniapp-identity.js", ("requestContact", "/api/miniapp/session"), "native phone consent frontend"),
              ("/miniapp-customer.js", ("/api/customer/me/orders", "/api/customer/me/bones"), "existing customer purchases and bones"),
              ("/miniapp-work.js", ("share-phone", "phone-login"), "staff passwordless cabinet UI"),
              ("/api/points", ('"points"',), "salons API"),
              ("/api/products", ('"products"',), "products API"),
          ]
          failures = []
          for attempt in range(1, 10):
              failures = []
              for path, needles, label in get_checks:
                  try:
                      req = urllib.request.Request(root + path + "?smoke=phone-v1-" + str(attempt), headers={
                          "User-Agent": "HvostMarket-Phone-Login-Live-Smoke/1.0",
                          "Cache-Control": "no-cache",
                      })
                      with urllib.request.urlopen(req, timeout=12) as response:
                          body = response.read(4000000).decode("utf-8")
                          ok = response.status == 200 and all(n in body for n in needles)
                          if not ok:
                              failures.append((path, "unexpected contents or HTTP status"))
                  except Exception as err:
                      failures.append((path, repr(err)[:160]))
              for path in ("/api/miniapp/accounts", "/api/miniapp/session"):
                  try:
                      req = urllib.request.Request(root + path, headers={
                          "Content-Type": "application/json",
                          "User-Agent": "HvostMarket-Phone-Login-Live-Smoke/1.0",
                      }, data=b'{"initData":"invalid","role":"admin","phone":"79131111111"}', method="POST")
                      with urllib.request.urlopen(req, timeout=12) as response:
                          failures.append((path, "invalid Telegram signature unexpectedly accepted HTTP " + str(response.status)))
                  except urllib.error.HTTPError as err:
                      if err.code != 401:
                          failures.append((path, "invalid signed request rejected HTTP " + str(err.code) + " instead of 401"))
                  except Exception as err:
                      failures.append((path, repr(err)[:160]))
              if not failures:
                  print("PASS all 6 live frontend/API reads and both invalid signed requests rejected HTTP 401", flush=True)
                  break
              print("Attempt", attempt, "deployment not ready:", failures, flush=True)
              if attempt < 9:
                  time.sleep(10)
          else:
              raise SystemExit("FAIL live Mini App phone identity deployment: " + repr(failures))
          PY
