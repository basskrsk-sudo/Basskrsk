name: Temporary customer-first Mini App production check

on:
  pull_request:
    paths:
      - .github/workflows/customer-first-live-smoke.yml

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check current Amvera Mini App and secure typed-phone endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          import urllib.error

          root="https://xn--80adktilqfjfx.xn--p1ai"
          assets=[
              ("/miniapp.html", ["setView('profile')","if(view==='work'&&!isPhoneAccessUnlocked())view='profile'","class=\"tab hide\" type=\"button\" data-view=\"work\""]),
              ("/miniapp-customer.js", ["customerPhoneGateForm","Введите номер телефона","identity.verifyPhone(enteredPhone)","accessibleCabinets(status)"]),
              ("/miniapp-identity.js", ["/api/miniapp/verify-phone","gateUnlocked","contactVerified"]),
              ("/miniapp-work.js", ["var available = order.filter(phoneRoleAvailable)","if (!phoneRoleAvailable(role))"]),
          ]
          for attempt in range(1,11):
              problems=[]
              for path,needles in assets:
                  try:
                      req=urllib.request.Request(root+path+"?live=phone-entry-v1-"+str(attempt),
                          headers={"User-Agent":"HvostMarket-Customer-First-Probe/1.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=16) as response:
                          data=response.read(2500000).decode("utf-8")
                          missing=[needle for needle in needles if needle not in data]
                          if response.status!=200 or missing:
                              problems.append((path,"missing content: "+str(missing)))
                  except Exception as exc:
                      problems.append((path,repr(exc)[:150]))
              # An unsigned body must NEVER reveal a person's phone or roles.
              try:
                  req=urllib.request.Request(root+"/api/miniapp/verify-phone",
                      data=b'{"initData":"invalid","phone":"79135554406"}',
                      headers={"Content-Type":"application/json","User-Agent":"HvostMarket-Customer-First-Probe/1.0"},
                      method="POST")
                  with urllib.request.urlopen(req,timeout=15) as response:
                      problems.append(("/api/miniapp/verify-phone","UNSIGNED AUTH WAS ACCEPTED: "+str(response.status)))
              except urllib.error.HTTPError as exc:
                  if exc.code!=401:
                      problems.append(("/api/miniapp/verify-phone","expected HTTP 401, got "+str(exc.code)))
              except Exception as exc:
                  problems.append(("/api/miniapp/verify-phone",repr(exc)[:150]))
              if not problems:
                  print("PASS customer-first start, entered phone check and matching-role gate deployed",flush=True)
                  print("PASS invalid Telegram signature rejected with HTTP 401",flush=True)
                  break
              print("Attempt",attempt,":",problems,flush=True)
              if attempt<10:time.sleep(10)
          else:
              raise SystemExit("FAIL: Amvera is still serving old Mini App or the signed endpoint is unavailable")
          PY
