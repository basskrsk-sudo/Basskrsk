name: HvostMarket site uptime

on:
  # GitHub schedules may start late; five minutes is not a guaranteed SLA.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send one test Telegram monitoring notification (no outage simulated)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: hvostmarket-uptime
  cancel-in-progress: false

jobs:
  verify-public-site:
    name: Проверка сайта, SQLite, API и Mini App
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Telegram notification without touching production
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        run: |
          node - <<'NODE'
          const { telegram } = require('./scripts/site-uptime-monitor');
          telegram('🧪 ХвостМаркет: тест уведомлений мониторинга GitHub Actions. Сайт не отключался.', {
            token: process.env.HM_MONITOR_TELEGRAM_TOKEN,
            chatId: process.env.HM_MONITOR_CHAT_ID,
          }).then(result => {
            if (!result.sent) {
              console.error('Тест Telegram не пройден: проверьте HM_MONITOR_TELEGRAM_TOKEN и HM_MONITOR_CHAT_ID в GitHub Actions Secrets.');
              process.exitCode = 1;
            } else console.log('Проверочное Telegram-сообщение доставлено.');
          }).catch(() => {
            console.error('Тест Telegram не пройден: ошибка отправки сообщения.');
            process.exitCode = 1;
          });
          NODE
        env:
          HM_MONITOR_TELEGRAM_TOKEN: ${{ secrets.HM_MONITOR_TELEGRAM_TOKEN }}
          HM_MONITOR_CHAT_ID: ${{ secrets.HM_MONITOR_CHAT_ID }}
      - name: Check site and manage GitHub incident + Telegram notification
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_notification }}
        run: node scripts/site-uptime-monitor.js
        env:
          GH_MONITOR_TOKEN: ${{ github.token }}
          GH_MONITOR_REPOSITORY: ${{ github.repository }}
          # Optional GitHub Actions secrets (not stored in source code).
          HM_MONITOR_TELEGRAM_TOKEN: ${{ secrets.HM_MONITOR_TELEGRAM_TOKEN }}
          HM_MONITOR_CHAT_ID: ${{ secrets.HM_MONITOR_CHAT_ID }}
