name: Temporary live Telegram header contrast verification

on:
  pull_request:
    paths:
      - .github/workflows/miniapp-header-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check production Mini App header colors
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          url = "https://xn--80adktilqfjfx.xn--p1ai/miniapp.html"
          required = [
              '<meta name="theme-color" content="#d5eadb">',
              "var TELEGRAM_NATIVE_HEADER_COLOR = '#d5eadb';",
              "tg.onEvent('themeChanged',applyTelegramChromeColors)",
          ]
          for attempt in range(1, 9):
              try:
                  request = urllib.request.Request(url, headers={
                      "User-Agent": "HvostMarket-Telegram-header-smoke/1.0",
                      "Cache-Control": "no-cache",
                  })
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read().decode('utf-8')
                      missing = [text for text in required if text not in body]
                      if response.status == 200 and not missing:
                          print("PASS HTTP 200: Production Mini App contains the light native header fix", flush=True)
                          print("PASS Telegram themeChanged handler applies the same light chrome color", flush=True)
                          break
                      print("Attempt", attempt, "HTTP", response.status, "missing expected strings:", missing, flush=True)
              except Exception as exc:
                  print("Attempt", attempt, "network issue", repr(exc), flush=True)
              if attempt < 8:
                  time.sleep(8)
          else:
              raise SystemExit("FAIL: Production Mini App does not yet contain the deployed header-color fix")
          PY
