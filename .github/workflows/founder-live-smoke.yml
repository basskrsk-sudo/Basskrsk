name: Temporary owner dashboard live smoke test

on:
  pull_request:
    paths:
      - .github/workflows/founder-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment and guard sensitive founder data
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          import urllib.error

          root='https://xn--80adktilqfjfx.xn--p1ai'
          assets=[
              ('/miniapp.html',['miniapp-founder.js','miniapp-founder-admin.js','miniapp-work.js']),
              ('/miniapp-founder.js',['ХвостМаркет в цифрах','Стратегия: 1000 точек','Система показателей BSC']),
              ('/miniapp-founder-admin.js',['businessFounderSetupForm','founderSetupPhone']),
              ('/miniapp-work.js',['hm_business_founder_token','/api/business-founder/dashboard','/api/business-founders']),
              ('/miniapp-work.css',['founder-banner','founder-month','founder-setup']),
          ]
          endpoints=[
              '/api/business-founder/me',
              '/api/business-founder/dashboard?period=30d',
              '/api/business-founders',
          ]
          for attempt in range(1,10):
              issues=[]
              for path,needles in assets:
                  try:
                      req=urllib.request.Request(root+path+'?smoke=owners-v1-'+str(attempt),headers={
                          'User-Agent':'HvostMarket-Founder-Smoke/1.0','Cache-Control':'no-cache',
                      })
                      with urllib.request.urlopen(req,timeout=15) as response:
                          body=response.read(4500000).decode('utf-8')
                          if response.status!=200 or any(needle not in body for needle in needles):
                              issues.append((path,'missing deployment strings'))
                  except Exception as exc:
                      issues.append((path,repr(exc)[:160]))
              for endpoint in endpoints:
                  try:
                      req=urllib.request.Request(root+endpoint,headers={
                          'User-Agent':'HvostMarket-Founder-Smoke/1.0','Cache-Control':'no-cache'
                      })
                      with urllib.request.urlopen(req,timeout=15) as response:
                          issues.append((endpoint,'UNAUTHORIZED DATA EXPOSED: HTTP '+str(response.status)))
                  except urllib.error.HTTPError as err:
                      if err.code!=401:
                          issues.append((endpoint,'expected HTTP 401 got '+str(err.code)))
                  except Exception as exc:
                      issues.append((endpoint,repr(exc)[:160]))
              if not issues:
                  print('PASS 5 founder UI assets deployed')
                  print('PASS all 3 founder confidential endpoints reject anonymous access with HTTP 401')
                  break
              print('Attempt',attempt,'deployment not ready:',issues,flush=True)
              if attempt<9:time.sleep(10)
          else:
              raise SystemExit('FAIL founder rollout smoke: '+repr(issues))
          PY
