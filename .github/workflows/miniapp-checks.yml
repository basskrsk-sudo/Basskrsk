      - public/miniapp-telegram-context.js
      - server/miniapp-telegram-context.test.js
      - server/static-cache.js
      - server/static-cache.test.js
      - public/miniapp-home-screen.js
      - public/miniapp-home-screen.css
      - public/manifest-miniapp.json
      - server/miniapp-home-screen.test.js
      - public/miniapp-work.js
      - public/miniapp-tasks.js
      - server/routes-miniapp-tasks.js
      - server/miniapp-manager-messages.js
      - server/miniapp-manager-messages.test.js
      - server/miniapp-staff-tasks.test.js
      - server/miniapp-staff-tasks-ui.test.js
      - public/miniapp-founder.js
