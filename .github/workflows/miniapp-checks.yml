      - server/task-daily-digest.js
      - server/task-daily-digest.test.js
      - server/task-reminders.js
      - server/partner-tiers.js
      - server/partner-tier-approvals.js
      - server/partner-tier-approvals.test.js
      - server/routes-partner-club.js
      - server/partner-club-photo-posts.js
      - server/partner-club-photo-posts.test.js
      - server/telegram.js
      - server/miniapp-bot-links.js
      - server/miniapp-existing-bot.test.js
      - server/business-founders.js
      - server/routes-business-founders.js
      - server/business-founders.test.js
      - server/miniapp-founder-ui.test.js
      - server/routes-auth.js
      - server/routes-miniapp-admin-registration.js
      - server/miniapp-admin-registration.test.js
      - server/telegram-bot-identity.js
      - server/telegram-bot-identity.test.js
      - server/miniapp-phone-identity.js
      - server/routes-customers.js
      - server/routes-partners.js
      - server/routes-owners.js
      - server/miniapp-role-data-audit.test.js
      - server/miniapp-phone-identity.test.js
      - server/miniapp-identity-ui.test.js
      - server/miniapp-customer-first.test.js
      - server/miniapp-header-contrast.test.js
      - server/routes-payment.js
      - server/server.js
      - server/task-seed-2026-11-01.js
      - server/task-seed-2026-11-01.test.js
      - server/task-seed-2026-11-02.js
      - server/task-seed-2026-11-02.test.js
      - .github/workflows/miniapp-checks.yml
  workflow_dispatch:

jobs:
  miniapp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server and bot JavaScript syntax
        run: |
          node --check server/server.js
          node --check server/task-seed-2026-11-01.js
          node --check server/task-seed-2026-11-01.test.js
          node --check server/task-seed-2026-11-02.js
          node --check server/task-seed-2026-11-02.test.js
          node --check server/routes-payment.js
          node --check server/routes-miniapp.js
          node --check server/routes-managers.js
          node --check server/routes-products.js
          node --check server/manager-miniapp-create-point.test.js
          node --check server/manager-payouts.js
          node --check server/manager-compensation-consistency.test.js
          node --check server/payout-reminders.js
          node --check server/manager-current-points.test.js
          node --check server/manager-miniapp-registration.test.js
          node --check server/routes-miniapp-tasks.js
          node --check server/miniapp-manager-messages.js
          node --check server/miniapp-manager-messages.test.js
          node --check public/miniapp-tasks.js
          node --check server/telegram-login-poller.js
          node --check server/telegram-connection-alerts.js
          node --check server/telegram-connection-alerts.test.js
          node --check server/task-daily-digest.js
          node --check server/task-daily-digest.test.js
          node --check server/task-reminders.js
          node --check server/partner-tiers.js
          node --check server/partner-tier-approvals.js
          node --check server/routes-partner-club.js
          node --check server/partner-club-photo-posts.js
          node --check server/telegram.js
          node --check server/new-product-broadcast.js
          node --check server/miniapp-bot-links.js
          node --check server/miniapp-phone-identity.js
          node --check server/business-founders.js
          node --check server/routes-business-founders.js
          node --check server/routes-auth.js
          node --check server/routes-miniapp-admin-registration.js
          node --check server/miniapp-admin-registration.test.js
          node --check server/telegram-bot-identity.js
          node --check server/routes-telegram-connections.js
          node --check public/telegram-connections.js
          node --check public/miniapp-founder.js
          node --check public/miniapp-founder-admin.js
          node --check server/routes-customers.js
          node --check server/routes-partners.js
          node --check server/routes-owners.js
          node --check server/miniapp-role-data-audit.test.js
          node --check public/miniapp-identity.js
          node --check public/miniapp-customer.js
          node --check public/miniapp-work.js
          node --check public/miniapp-telegram-context.js
          node --check server/miniapp-telegram-context.test.js
          node --check public/miniapp-home-screen.js
          node --check server/miniapp-home-screen.test.js
          node --check public/notification-settings.js
          node --check server/notification-preferences.js
          node --check server/routes-notification-preferences.js
          node --check server/order-notifications.js
          node --check server/unpaid-order-alerts.js
          node --check server/unpaid-order-alerts.test.js
          node --check server/payout-reminders.js
          node --check server/winback.js
          node --check public/miniapp-return.js
      - name: Check Mini App inline JavaScript syntax
        run: |
          node -e "const fs=require('node:fs');const s=fs.readFileSync('public/miniapp.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>\s*<\/body>/);if(!m)throw new Error('missing Mini App script');new Function(m[1]);console.log('Mini App JavaScript syntax OK');"
      - name: Verify Telegram auth and all four staff dashboards
        run: node --test --test-concurrency=1 server/unpaid-order-alerts.test.js server/miniapp-admin-registration.test.js server/manager-miniapp-create-point.test.js server/manager-miniapp-registration.test.js server/manager-compensation-consistency.test.js server/miniapp-role-data-audit.test.js server/manager-current-points.test.js server/routes-miniapp.test.js server/miniapp-existing-bot.test.js server/miniapp-work-ui.test.js server/miniapp-telegram-context.test.js server/static-cache.test.js server/miniapp-home-screen.test.js server/miniapp-header-contrast.test.js server/miniapp-phone-identity.test.js server/miniapp-identity-ui.test.js server/miniapp-customer-first.test.js server/business-founders.test.js server/miniapp-founder-ui.test.js server/notification-preferences.test.js server/notification-settings-ui.test.js server/telegram-connections.test.js server/telegram-bot-identity.test.js server/telegram-connection-alerts.test.js server/task-daily-digest.test.js server/new-product-broadcast.test.js server/partner-club-photo-posts.test.js server/partner-club-reroll.test.js server/partner-tier-approvals.test.js server/miniapp-staff-tasks.test.js server/miniapp-staff-tasks-ui.test.js server/miniapp-manager-messages.test.js server/task-seed-2026-11-01.test.js server/task-seed-2026-11-02.test.js
