      - name: Check Mini App inline JavaScript syntax
        run: |
          node -e "const fs=require('node:fs');const s=fs.readFileSync('public/miniapp.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>\s*<\/body>/);if(!m)throw new Error('missing Mini App script');new Function(m[1]);console.log('Mini App JavaScript syntax OK');"
      - name: Check gift page inline scripts
        run: |
          node -e "const fs=require('node:fs');for(const f of ['public/gift.html','public/gift-admin.html']){const s=fs.readFileSync(f,'utf8');const m=s.match(/<script>([\\s\\S]*?)<\\/script>\\s*<\\/body>/);if(!m)throw new Error('Missing gift UI script in '+f);new Function(m[1]);console.log('Valid JS: '+f)}"
