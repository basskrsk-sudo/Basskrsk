name: Temporary live Mini App smoke check

on:
  pull_request:
    paths:
      - .github/workflows/miniapp-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production site and Mini App assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from urllib.error import URLError, HTTPError

          root = "https://xn--80adktilqfjfx.xn--p1ai"
          checks = [
              ("/miniapp.html", lambda b: b"miniapp-work.js" in b and b'id="workPage"' in b, "Telegram Mini App main screen"),
              ("/miniapp-work.js", lambda b: b"HvostMiniAppWork" in b and b"managerDashboard" in b, "four staff role dashboards"),
              ("/miniapp-work.css", lambda b: b"work-auth-card" in b, "staff role styles"),
              ("/api/points", lambda b: isinstance(json.loads(b)["points"], list), "live salons API"),
              ("/api/products", lambda b: isinstance(json.loads(b)["products"], list), "live catalog API"),
          ]

          failed = []
          for path, check, label in checks:
              last = ""
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(root + path, headers={"User-Agent": "HvostMarket-miniapp-live-smoke/1.0"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          data = response.read(3000000)
                          ok = response.status == 200 and bool(check(data))
                          last = "HTTP " + str(response.status) + ", content=" + ("verified" if ok else "unexpected")
                          if ok:
                              print("PASS", label, path, last, flush=True)
                              break
                  except Exception as e:
                      last = str(e)[:230]
                  if attempt < 2:
                      time.sleep(8)
              else:
                  print("FAIL", label, path, last, flush=True)
                  failed.append(path)
          if failed:
              raise SystemExit("Live production smoke check failed on " + ", ".join(failed))
          # Invalid Telegram identity must be rejected by the running server.
          # This is read-only validation of auth; no payments/orders are created.
          invalid = urllib.request.Request(
              root + "/api/miniapp/auth",
              data=b'{"initData":"intentionally-invalid"}',
              headers={"Content-Type": "application/json", "User-Agent": "HvostMarket-miniapp-live-smoke/1.0"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(invalid, timeout=15) as response:
                  raise SystemExit("FAIL: invalid Telegram login unexpectedly passed, HTTP " + str(response.status))
          except HTTPError as e:
              if e.code != 401:
                  raise SystemExit("FAIL: invalid Telegram login returned HTTP " + str(e.code) + " instead of 401")
              print("PASS invalid Telegram login rejected: HTTP 401", flush=True)
          print("All production Mini App routes and auth gate are available")
          PY
