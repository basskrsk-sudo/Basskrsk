<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075642">
<title>Купить за 1 минуту — ХвостМаркет</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="https://yookassa.ru/checkout-widget/v1/checkout-widget.js"></script>
<style>
  :root {
    --forest:#075642; --deep:#138066; --cream:#F5F7ED; --mint:#D8EDDF;
    --amber:#F2AD3D; --amber-lt:#F6C45A; --muted:#63766D; --border:#D8E7DC;
    --text:#0D4436; --warn-bg:#FDF3DC;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:'Manrope',system-ui,sans-serif;
    background:var(--cream); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
  }
  .wrap { width:100%; max-width:430px; margin:0 auto; padding:0 16px; flex:1; display:flex; flex-direction:column; }
  @media (min-width:768px) { .wrap { max-width:520px; } }

  header { display:flex; align-items:center; justify-content:space-between; padding:14px 0 10px; }
  .logo { font-weight:800; font-size:18px; color:var(--forest); text-decoration:none; }
  .logo span { color:var(--amber); }
  .point-chip { font-size:12px; color:var(--deep); background:var(--mint); border-radius:999px; padding:4px 10px; max-width:55%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  main { flex:1; display:flex; flex-direction:column; padding-bottom:16px; }
  .muted { color:var(--muted); }
  .small { font-size:13px; }
  .center { text-align:center; }

  .hero { background:#fff; border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-top:8px; }
  .hero-img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--mint); }
  .hero-icon { width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; font-size:72px; background:var(--mint); }
  .hero-body { padding:16px; }
  .badge { display:inline-block; font-size:11px; font-weight:700; color:var(--accent-text,#7A4A00); background:var(--warn-bg); border-radius:6px; padding:3px 8px; margin-bottom:8px; }
  h1 { font-size:22px; line-height:1.2; color:var(--forest); margin-bottom:6px; }
  .desc { font-size:14px; line-height:1.5; color:var(--muted); margin-bottom:12px; }
  .comp { list-style:none; margin-bottom:12px; }
  .comp li { display:flex; gap:8px; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .comp li::before { content:'✓'; color:var(--deep); font-weight:700; flex-shrink:0; }

  .variants { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .variant { border:1.5px solid var(--border); border-radius:10px; background:#fff; padding:8px 12px; font-size:14px; cursor:pointer; font-family:inherit; color:var(--text); }
  .variant.sel { border-color:var(--deep); background:var(--mint); font-weight:700; }
  .variant:disabled { opacity:.4; text-decoration:line-through; cursor:default; }

  .price-row { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  .price { font-size:28px; font-weight:800; color:var(--forest); }
  .stock-note { font-size:12px; color:var(--muted); margin-bottom:14px; }
  .stock-note.low { color:#B3541E; font-weight:600; }

  .cta {
    display:block; width:100%; border:none; border-radius:12px; background:var(--amber);
    color:#053F32; font-size:16px; font-weight:800; padding:15px; cursor:pointer;
    font-family:inherit; transition:background .15s;
  }
  .cta:hover { background:var(--amber-lt); }
  .cta:disabled { opacity:.5; cursor:default; }
  .link-btn { display:block; width:100%; text-align:center; margin-top:10px; background:none; border:none; color:var(--deep); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; padding:8px; }

  .panel { background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; margin-top:8px; }
  .panel h2 { font-size:18px; color:var(--forest); margin-bottom:12px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px; }
  input[type=tel] {
    width:100%; border:1.5px solid var(--border); border-radius:10px; padding:13px 14px;
    font-size:16px; font-family:inherit; color:var(--text); background:var(--cream); outline:none;
  }
  input[type=tel]:focus { border-color:var(--deep); }
  .pay-methods { display:flex; gap:8px; margin:14px 0; }
  .pm { flex:1; border:1.5px solid var(--deep); border-radius:10px; background:var(--deep); color:#fff; font-size:14px; font-weight:700; padding:11px; cursor:pointer; font-family:inherit; }
  .pm.off { background:#fff; color:var(--deep); border-color:var(--border); font-weight:600; }
  .err { display:none; color:#B3261E; font-size:13px; margin-top:8px; }
  .note { background:var(--warn-bg); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--deep); line-height:1.5; margin-top:12px; display:none; }
  #yk-box { display:none; margin-top:14px; }

  .alt-list { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .alt { background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px; text-decoration:none; color:var(--text); }
  .alt .ic { font-size:28px; }
  .alt b { display:block; font-size:13px; margin:6px 0 2px; color:var(--forest); }
  .alt span { font-size:13px; color:var(--muted); }

  .success { text-align:center; padding:32px 16px; }
  .success .big { font-size:56px; margin-bottom:12px; }
  .success h2 { font-size:24px; color:var(--forest); margin-bottom:8px; }
  .success p { font-size:15px; line-height:1.6; color:var(--muted); }
  .order-code { display:inline-block; background:var(--mint); color:var(--forest); font-weight:700; border-radius:8px; padding:6px 14px; margin-top:12px; font-size:15px; }

  .state { text-align:center; padding:48px 16px; color:var(--muted); }
  .state .em { font-size:44px; margin-bottom:12px; }
  .state h2 { font-size:19px; color:var(--forest); margin-bottom:8px; }
  .state p { font-size:14px; line-height:1.55; }

  footer { text-align:center; font-size:12px; color:var(--muted); padding:14px 0 20px; }
  footer a { color:var(--deep); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">Хвост<span>Маркет</span></a>
    <div class="point-chip" id="pointChip" style="display:none"></div>
  </header>
  <main id="app"><div class="state"><div class="em">⏳</div><h2>Открываем товар…</h2></div></main>
  <footer>ХвостМаркет · оплата через ЮKassa · <a href="/privacy-policy.html">конфиденциальность</a></footer>
</div>

<script>
'use strict';
var app = document.getElementById('app');

/* ── Параметры: /p/{точка}/{товар} или старый формат ?ref=&product= ── */
function parseParams() {
  var m = location.pathname.match(/^\/p\/([^/]+)\/([^/]+)\/?$/);
  if (m) return { point: decodeURIComponent(m[1]), product: decodeURIComponent(m[2]) };
  var q = new URLSearchParams(location.search);
  return { point: q.get('ref') || '', product: q.get('product') || '' };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtPrice(n) { return n.toLocaleString('ru-RU') + ' ₽'; }
function validatePhone(p) { return /^\+7\d{10}$/.test(p); }
function normPhone(p) {
  var d = String(p).replace(/\D/g, '');
  if (d.length === 11 && (d[0] === '8' || d[0] === '7')) d = d.slice(1);
  if (d.length === 10) return '+7' + d;
  return null;
}

var CTX = { point: null, product: null, variants: [], selVariant: null, method: 'sbp', checkout: null };

function state(html) { app.innerHTML = html; window.scrollTo(0, 0); }

function loadState(msg, em) {
  state('<div class="state"><div class="em">' + (em || '⏳') + '</div><h2>' + esc(msg) + '</h2></div>');
}

function failState(title, text, alts) {
  var html = '<div class="state"><div class="em">🙁</div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>';
  if (alts && alts.length) {
    html += '<div class="alt-list" style="text-align:left">';
    alts.forEach(function(a) {
      html += '<a class="alt" href="/p/' + encodeURIComponent(CTX.pointId || '') + '/' + encodeURIComponent(a.slug) + '">'
        + '<div class="ic">' + esc(a.icon || '🦴') + '</div><b>' + esc(a.name) + '</b><span>' + fmtPrice(a.fromPrice) + '</span></a>';
    });
    html += '</div>';
  }
  if (CTX.pointId) html += '<button class="link-btn" onclick="location.href=\'/?ref=' + encodeURIComponent(CTX.pointId) + '\'">Весь каталог этой точки</button>';
  html += '</div>';
  state(html);
}

/* ── Загрузка данных ── */
async function boot() {
  var p = parseParams();
  CTX.pointId = p.point; CTX.productSlug = p.product;
  if (!p.point || !p.product) {
    failState('Не получилось открыть товар', 'Ссылка неполная. Попробуйте отсканировать QR-код на упаковке ещё раз.');
    return;
  }
  try {
    var res = await fetch('/api/products', { cache: 'no-store' });
    if (!res.ok) throw new Error('catalog');
    var pdata = await res.json();
    var products = pdata.products || pdata;
    var pres = await fetch('/api/points', { cache: 'no-store' });
    var ptsdata = pres.ok ? await pres.json() : {};
    var points = ptsdata.points || [];
    CTX.point = (points || []).find(function(x) { return x.id === p.point; }) || null;
    var prod = (products || []).find(function(x) { return x.slug === p.product || String(x.id) === String(p.product); });
    if (!prod) { failState('Товар не найден', 'Возможно, его сняли с продажи.'); return; }
    CTX.product = prod;

    var chip = document.getElementById('pointChip');
    if (CTX.point) { chip.textContent = '📍 ' + CTX.point.name; chip.style.display = 'block'; }

    CTX.variants = (prod.variants || []).filter(function(v) { return v.active; })
      .map(function(v) { return { id: v.id, weight: v.weight, price: v.price, qty: (v.stock && typeof v.stock[p.point] === 'number') ? v.stock[p.point] : 0 }; });
    var avail = CTX.variants.filter(function(v) { return v.qty > 0; });
    if (!avail.length) {
      var alts = findAlts(products, prod, p.point);
      failState('Сейчас нет на полке', 'Этого товара временно нет в точке' + (CTX.point ? ' «' + CTX.point.name + '»' : '') + '.' + (alts.length ? ' Посмотрите, что есть рядом:' : ''), alts);
      return;
    }
    CTX.selVariant = avail[0];
    renderCard();
  } catch (e) {
    failState('Не удалось загрузить', 'Проверьте интернет и обновите страницу.');
  }
}

function findAlts(products, current, pointId) {
  var out = [];
  for (var i = 0; i < products.length && out.length < 2; i++) {
    var pr = products[i];
    if (!pr.active || pr.id === current.id || pr.category !== current.category) continue;
    var best = null;
    (pr.variants || []).forEach(function(v) {
      if (!v.active) return;
      var q = (v.stock && typeof v.stock[pointId] === 'number') ? v.stock[pointId] : 0;
      if (q > 0 && (!best || v.price < best.price)) best = { price: v.price };
    });
    if (best) out.push({ slug: pr.slug, name: pr.name, icon: pr.icon, fromPrice: best.price });
  }
  return out;
}

/* ── Экран 1: карточка товара ── */
function renderCard() {
  var pr = CTX.product, v = CTX.selVariant;
  var totalQty = CTX.variants.reduce(function(s, x) { return s + x.qty; }, 0);
  var comp = [];
  try { comp = JSON.parse(pr.comp || '[]'); } catch (e) { comp = []; }
  comp = comp.slice(0, 4);

  var html = '<div class="hero"><div class="' + (pr.img ? 'hero-img-wrap' : 'hero-icon') + '">';
  html += pr.img ? '<img class="hero-img" src="' + esc(pr.img) + '" alt="' + esc(pr.name) + '">' : esc(pr.icon || '🦴');
  html += '</div><div class="hero-body">';
  if (pr.badge) html += '<div class="badge">' + esc(pr.badge) + '</div>';
  html += '<h1>' + esc(pr.name) + '</h1>';
  if (pr.desc) html += '<p class="desc">' + esc(pr.desc) + '</p>';
  if (comp.length) html += '<ul class="comp">' + comp.map(function(c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>';

  var avail = CTX.variants.filter(function(x) { return x.qty > 0; });
  if (CTX.variants.length > 1) {
    html += '<div class="variants">' + CTX.variants.map(function(x) {
      var dis = x.qty > 0 ? '' : ' disabled';
      var sel = x.id === v.id ? ' sel' : '';
      return '<button class="variant' + sel + '"' + dis + ' onclick="pickVariant(' + x.id + ')">' + esc(x.weight) + ' · ' + fmtPrice(x.price) + '</button>';
    }).join('') + '</div>';
  }

  html += '<div class="price-row"><div class="price">' + fmtPrice(v.price) + '</div></div>';
  html += '<div class="stock-note' + (totalQty <= 2 ? ' low' : '') + '">' + (totalQty <= 2 ? '⚡ Осталось всего ' + totalQty + ' шт на полке' : 'В наличии на полке') + '</div>';
  html += '<button class="cta" onclick="showPhoneStep()">Купить сейчас →</button>';
  html += '<button class="link-btn" onclick="location.href=\'/?ref=' + encodeURIComponent(CTX.pointId) + '\'">Весь каталог этой точки</button>';
  html += '</div></div>';
  state(html);
}

function pickVariant(id) {
  var v = CTX.variants.find(function(x) { return x.id === id; });
  if (v && v.qty > 0) { CTX.selVariant = v; renderCard(); }
}

/* ── Экран 2: телефон ── */
function showPhoneStep() {
  var v = CTX.selVariant;
  state('<div class="panel"><h2>Почти готово</h2>'
    + '<p class="small muted" style="margin-bottom:14px">' + esc(CTX.product.name) + ' · ' + esc(v.weight) + ' · <b>' + fmtPrice(v.price) + '</b>'
    + (CTX.point ? '<br>Забрать: ' + esc(CTX.point.name) + (CTX.point.addr ? ', ' + esc(CTX.point.addr) : '') : '') + '</p>'
    + '<label for="phone">Номер телефона</label>'
    + '<input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="+7 (900) 000-00-00" value="+7">'
    + '<p class="small muted" style="margin-top:6px">Пришлём подтверждение оплаты и начислим косточки-бонусы.</p>'
    + '<div class="pay-methods">'
    + '<button class="pm" id="pm-sbp" onclick="setMethod(\'sbp\')">СБП</button>'
    + '<button class="pm off" id="pm-card" onclick="setMethod(\'bank_card\')">Карта</button>'
    + '</div>'
    + '<button class="cta" id="payBtn" onclick="startPayment()">Оплатить ' + fmtPrice(v.price) + '</button>'
    + '<div class="err" id="err"></div>'
    + '<button class="link-btn" onclick="renderCard()">← Назад к товару</button></div>');
  var inp = document.getElementById('phone');
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
}

function setMethod(m) {
  CTX.method = m === 'bank_card' ? 'bank_card' : 'sbp';
  document.getElementById('pm-sbp').className = 'pm' + (CTX.method === 'sbp' ? '' : ' off');
  document.getElementById('pm-card').className = 'pm' + (CTX.method === 'bank_card' ? '' : ' off');
}

function showErr(msg) { var e = document.getElementById('err'); e.textContent = msg; e.style.display = 'block'; }

/* ── Экран 3: оплата ── */
async function startPayment() {
  var phone = normPhone(document.getElementById('phone').value);
  if (!validatePhone(phone || '')) { showErr('Укажите телефон в формате +7 (900) 000-00-00.'); return; }
  var btn = document.getElementById('payBtn');
  btn.disabled = true; btn.textContent = 'Готовим оплату…';

  var orderId = 'TG-' + Date.now();
  var v = CTX.selVariant;
  try {
    var res = await fetch('/api/create-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        orderId: orderId,
        amount: v.price,
        method: CTX.method,
        customerPhone: phone,
        customerEmail: null,
        customerName: null,
        customerLname: null,
        pickupPoint: CTX.point ? CTX.point.name + (CTX.point.addr ? ' — ' + CTX.point.addr : '') : '',
        pointId: CTX.pointId,
        partnerId: null,
        comment: null,
        bonesUsed: 0,
        fulfillmentType: 'pickup',
        deliveryAddress: null,
        cityId: null,
        referralCode: null,
        cartItems: [{ variantId: v.id, qty: 1 }]
      })
    });
    var data = await res.json();
    if (!res.ok) throw new Error((data && data.error) || 'Не удалось создать заказ');

    if (data.demo === true) { showSuccess(orderId, phone); return; }

    var note = document.getElementById('payNote');
    if (!data.confirmation_token) throw new Error((data && data.error) || 'Не удалось создать платёж');

    btn.style.display = 'none';
    var noteEl = document.createElement('div');
    noteEl.className = 'note'; noteEl.id = 'payNote';
    noteEl.style.display = 'block';
    noteEl.textContent = '🔒 Товар зарезервирован на ' + (data.reservation_minutes || 15) + ' минут. Завершите оплату в этом окне.';
    btn.parentNode.insertBefore(noteEl, btn.nextSibling);
    var box = document.createElement('div');
    box.id = 'yk-box'; box.style.display = 'block';
    btn.parentNode.insertBefore(box, noteEl.nextSibling);

    var finished = false;
    var stopTimer = null;
    var checkout = new window.YooMoneyCheckoutWidget({
      confirmation_token: data.confirmation_token,
      return_url: location.href.split('?')[0],
      error_callback: function() { showErr('⚠️ Ошибка инициализации оплаты, попробуйте ещё раз.'); }
    });
    CTX.checkout = checkout;

    async function checkStatus() {
      try {
        var r = await fetch('/api/payment-status/' + encodeURIComponent(data.payment_id), { cache: 'no-store' });
        if (!r.ok) return;
        var st = await r.json();
        if (finished) return;
        if (st.paid) { finished = true; if (stopTimer) clearInterval(stopTimer); try { checkout.destroy(); } catch (e) {} showSuccess(orderId, phone); }
        else if (st.status === 'failed' || st.status === 'canceled') {
          finished = true; if (stopTimer) clearInterval(stopTimer); try { checkout.destroy(); } catch (e) {}
          box.style.display = 'none';
          noteEl.textContent = 'Оплата не прошла. Можно безопасно попробовать оплатить заказ заново.';
          btn.style.display = 'block'; btn.disabled = false; btn.textContent = 'Оплатить ' + fmtPrice(v.price);
        }
      } catch (e) { /* временный сбой — опрос продолжится */ }
    }

    checkout.on('success', function() {
      noteEl.textContent = '⏳ Подтверждаем оплату на сервере. Не закрывайте страницу…';
      checkStatus();
    });
    checkout.on('fail', function() {
      noteEl.textContent = 'Оплата не прошла. Попробуйте ещё раз.';
    });
    await checkout.render('yk-box');
    checkStatus();
    stopTimer = setInterval(checkStatus, 2500);
  } catch (e) {
    showErr(e.message || 'Что-то пошло не так. Попробуйте ещё раз.');
    btn.disabled = false; btn.textContent = 'Оплатить ' + fmtPrice(v.price);
  }
}

/* ── Экран 4: успех ── */
function showSuccess(orderId, phone) {
  state('<div class="panel success"><div class="big">✅</div>'
    + '<h2>Оплата прошла!</h2>'
    + '<p>Товар можно забирать с полки' + (CTX.point ? ' в точке «' + esc(CTX.point.name) + '»' : '') + '.<br>Обращаться к сотруднику не нужно.</p>'
    + '<div class="order-code">Заказ ' + esc(orderId) + '</div>'
    + '<p class="small" style="margin-top:14px">Подтверждение отправлено на ' + esc(phone) + '.<br>Косточки-бонусы начислятся на этот номер.</p>'
    + '<button class="link-btn" onclick="location.href=\'/?ref=' + encodeURIComponent(CTX.pointId) + '\'">Смотреть весь каталог точки</button>'
    + '</div>');
}

boot();
</script>
</body>
</html>
