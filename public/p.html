<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A4A38">
<title>Купить за 1 минуту — ХвостМаркет</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://yookassa.ru">
<style>
  :root {
    --forest:#0A4A38; --deep:#0D5C46; --leaf:#12755A; --cream:#F7F5EF; --mint:#DCEDE2;
    --amber:#E8A020; --amber-lt:#F6C45A; --muted:#5F7268; --border:#DFE8DC;
    --text:#0D332A; --warn-bg:#FBEFD4;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  html, body { overflow-x:hidden; overflow-x:clip; }
  * { -webkit-tap-highlight-color:transparent; }
  button, a, select, [onclick] { touch-action:manipulation; }
  body {
    font-family:'Manrope',system-ui,sans-serif;
    background:var(--cream); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
  }
  @supports (padding:max(0px)) {
    .wrap { padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); }
  }
  .wrap { width:100%; max-width:430px; margin:0 auto; padding:0 16px; flex:1; display:flex; flex-direction:column; }
  @media (min-width:768px) { .wrap { max-width:520px; } }

  header { display:flex; align-items:center; justify-content:space-between; padding:14px 0 10px; }
  .logo { font-weight:800; font-size:18px; color:var(--forest); text-decoration:none; }
  .logo span { color:var(--amber); }
  .point-chip { font-size:12px; color:var(--deep); background:var(--mint); border-radius:999px; padding:4px 10px; max-width:55%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  main { flex:1; display:flex; flex-direction:column; padding-bottom:16px; }
  .muted { color:var(--muted); }
  .small { font-size:13px; }
  .center { text-align:center; }

  .hero { background:#fff; border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-top:8px; }
  .hero-img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--mint); }
  .hero-icon { width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; font-size:72px; background:var(--mint); }
  .hero-body { padding:16px; }
  .badge { display:inline-block; font-size:11px; font-weight:700; color:var(--accent-text,#7A4A00); background:var(--warn-bg); border-radius:6px; padding:3px 8px; margin-bottom:8px; }
  h1 { font-size:22px; line-height:1.2; color:var(--forest); margin-bottom:6px; }
  .desc { font-size:14px; line-height:1.5; color:var(--muted); margin-bottom:12px; }
  .comp { list-style:none; margin-bottom:12px; }
  .comp li { display:flex; gap:8px; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .comp li::before { content:'✓'; color:var(--deep); font-weight:700; flex-shrink:0; }

  .variants { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .variant { border:1.5px solid var(--border); border-radius:10px; background:#fff; padding:8px 12px; font-size:14px; cursor:pointer; font-family:inherit; color:var(--text); }
  .variant.sel { border-color:var(--deep); background:var(--mint); font-weight:700; }
  .variant:disabled { opacity:.4; text-decoration:line-through; cursor:default; }

  .price-row { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  .price { font-size:28px; font-weight:800; color:var(--forest); }
  .stock-note { font-size:12px; color:var(--muted); margin-bottom:14px; }
  .stock-note.low { color:#B3541E; font-weight:600; }

  .cta {
    display:block; width:100%; border:none; border-radius:14px; background:linear-gradient(180deg,var(--amber-lt),var(--amber));
    color:#3A2700; font-size:16px; font-weight:800; padding:15px; cursor:pointer;
    font-family:inherit; transition:background .15s;
    box-shadow:0 6px 18px rgba(232,160,32,.28);
  }
  .cta:hover { background:var(--amber-lt); }
  .cta:disabled { opacity:.5; cursor:default; }
  .link-btn { display:block; width:100%; text-align:center; margin-top:10px; background:none; border:none; color:var(--deep); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; padding:8px; }

  .panel { background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; margin-top:8px; }
  .panel h2 { font-size:18px; color:var(--forest); margin-bottom:12px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px; }
  input[type=tel], .checkout-select {
    width:100%; border:1.5px solid var(--border); border-radius:10px; padding:13px 14px;
    font-size:16px; font-family:inherit; color:var(--text); background:var(--cream); outline:none;
  }
  input[type=tel]:focus, .checkout-select:focus { border-color:var(--deep); }
  .err { display:none; color:#B3261E; font-size:13px; margin-top:8px; }
  .note { background:var(--warn-bg); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--deep); line-height:1.5; margin-top:12px; display:none; }
  #yk-box { display:none; margin-top:14px; }

  .alt-list { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .alt { background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px; text-decoration:none; color:var(--text); }
  .alt .ic { font-size:28px; }
  .alt b { display:block; font-size:13px; margin:6px 0 2px; color:var(--forest); }
  .alt span { font-size:13px; color:var(--muted); }

  .success { text-align:center; padding:32px 16px; }
  .success .big { font-size:56px; margin-bottom:12px; }
  .success h2 { font-size:24px; color:var(--forest); margin-bottom:8px; }
  .success p { font-size:15px; line-height:1.6; color:var(--muted); }
  .take-product { font-size:20px; line-height:1.3; font-weight:800; color:var(--forest); margin:16px 0 6px; }
  .success-product { margin:16px 0 0; padding:12px; border-radius:12px; background:var(--cream); border:1px solid var(--border); }
  .success-product b { display:block; color:var(--text); font-size:15px; margin-bottom:3px; }
  .success-product span { color:var(--muted); font-size:13px; }
  .order-code { display:inline-block; background:var(--mint); color:var(--forest); font-weight:700; border-radius:8px; padding:6px 14px; margin-top:12px; font-size:15px; }
  .notify-title { margin:20px 0 8px; color:var(--forest); font-size:14px; font-weight:800; }
  .notify-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .notify-card { padding:10px; border:1px solid var(--border); border-radius:10px; background:#fff; font-size:12px; color:var(--muted); }
  .notify-card b { display:block; color:var(--forest); font-size:13px; margin-bottom:4px; }
  .notify-card button { width:100%; margin-top:8px; padding:8px 6px; border:0; border-radius:8px; color:#fff; font:700 12px 'Manrope',sans-serif; cursor:pointer; }
  .notify-status { margin-top:6px; font-size:11px; line-height:1.35; }
  @media(max-width:390px){.notify-grid{grid-template-columns:1fr}}

  .state { text-align:center; padding:48px 16px; color:var(--muted); }
  .state .em { font-size:44px; margin-bottom:12px; }
  .state h2 { font-size:19px; color:var(--forest); margin-bottom:8px; }
  .state p { font-size:14px; line-height:1.55; }

  footer { text-align:center; font-size:12px; color:var(--muted); padding:14px 0 20px; }
  footer a { color:var(--deep); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">Хвост<span>Маркет</span></a>
    <div class="point-chip" id="pointChip" style="display:none"></div>
  </header>
  <main id="app"><div class="state"><div class="em">⏳</div><h2>Открываем товар…</h2></div></main>
  <footer>ХвостМаркет · оплата через ЮKassa · <a href="/privacy-policy.html">конфиденциальность</a></footer>
</div>

<script src="/config.js"></script>
<script>
'use strict';
var app = document.getElementById('app');

/* ── Яндекс Метрика: тот же счётчик, что на основном сайте ── */
(function initMetrika() {
  var counterId = window.TAIGA_CONFIG && window.TAIGA_CONFIG.YANDEX_METRICA_ID;
  if (!counterId) return;
  (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
  m[i].l=1*new Date();
  for (var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}
  k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
  (window,document,'script','https://mc.yandex.ru/metrika/tag.js','ym');
  window.ym(counterId,'init',{clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:true});
  window._metricaCounterId = counterId;
})();

function trackGoal(goalName, params) {
  if (window.ym && window._metricaCounterId) {
    window.ym(window._metricaCounterId, 'reachGoal', goalName, params || {});
  }
}
function trackGoalOnce(goalName, uniqueKey, params) {
  var storageKey = 'hvostmarket_goal:' + goalName + ':' + String(uniqueKey || 'session');
  try {
    if (sessionStorage.getItem(storageKey)) return;
    sessionStorage.setItem(storageKey, '1');
  } catch (e) { /* продолжаем без защиты, если хранилище недоступно */ }
  trackGoal(goalName, params);
}

/* ── Параметры: /p/{точка}/{товар} или старый формат ?ref=&product= ── */
function parseParams() {
  var m = location.pathname.match(/^\/p\/([^/]+)\/([^/]+)\/?$/);
  if (m) return { point: decodeURIComponent(m[1]), product: decodeURIComponent(m[2]) };
  var q = new URLSearchParams(location.search);
  return { point: q.get('ref') || '', product: q.get('product') || '' };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtPrice(n) { return n.toLocaleString('ru-RU') + ' ₽'; }
function validatePhone(p) { return /^\+7\d{10}$/.test(p); }
function normPhone(p) {
  var d = String(p).replace(/\D/g, '');
  if (d.length === 11 && (d[0] === '8' || d[0] === '7')) d = d.slice(1);
  if (d.length === 10) return '+7' + d;
  return null;
}

var KNOWN_PHONE_KEY = 'taiga_known_phone';
function rememberPhone(phone) {
  var digits = String(phone || '').replace(/\D/g, '');
  if (digits.length >= 10) localStorage.setItem(KNOWN_PHONE_KEY, '7' + digits.slice(-10));
}
function knownPhone() {
  var digits = localStorage.getItem(KNOWN_PHONE_KEY) || '';
  if (digits.length === 10) digits = '7' + digits;
  return digits.length === 11 ? '+' + digits : '+7';
}

function rememberQrPoint(point) {
  if (!point || !point.id) return;
  var cityId = point.city_id || localStorage.getItem('taiga_city') || 'krsk';
  localStorage.setItem('taiga_city', cityId);
  localStorage.setItem('hvostmarket_catalog_point:' + cityId, String(point.id));
}

var CTX = { point: null, product: null, variants: [], selVariant: null, checkout: null, partners: [] };
var SUCCESS_PHONE = '';
var SUCCESS_ORDER_ID = '';
var YOOKASSA_WIDGET_URL = 'https://yookassa.ru/checkout-widget/v1/checkout-widget.js';
var widgetLoadPromise = null;

function widgetReady() { return typeof window.YooMoneyCheckoutWidget === 'function'; }
function loadWidget(forceReload) {
  if (widgetReady()) return Promise.resolve(true);
  if (forceReload) {
    document.querySelectorAll('script[data-yookassa-widget]').forEach(function(s) { s.remove(); });
    widgetLoadPromise = null;
  }
  if (widgetLoadPromise) return widgetLoadPromise;
  widgetLoadPromise = new Promise(function(resolve, reject) {
    var script = document.createElement('script');
    script.async = true;
    script.dataset.yookassaWidget = 'true';
    script.src = YOOKASSA_WIDGET_URL + (forceReload ? '?retry=' + Date.now() : '');
    var done = false;
    var timer = setTimeout(function() { finish(new Error('Платёжный модуль не ответил вовремя')); }, 10000);
    function finish(error) {
      if (done) return;
      done = true; clearTimeout(timer); script.onload = null; script.onerror = null;
      if (error) reject(error); else resolve(true);
    }
    script.onload = function() { finish(widgetReady() ? null : new Error('Платёжный модуль загрузился некорректно')); };
    script.onerror = function() { finish(new Error('Не удалось загрузить платёжный модуль')); };
    document.head.appendChild(script);
  }).catch(function(error) { widgetLoadPromise = null; throw error; });
  return widgetLoadPromise;
}
async function prepareWidget() {
  try { await loadWidget(false); return true; }
  catch (firstError) {
    console.warn('Первая загрузка виджета ЮKassa не удалась:', firstError);
    try { await loadWidget(true); return true; }
    catch (secondError) {
      console.warn('Используем защищённую страницу ЮKassa:', secondError);
      return false;
    }
  }
}

function state(html) { app.innerHTML = html; window.scrollTo(0, 0); }

function loadState(msg, em) {
  state('<div class="state"><div class="em">' + (em || '⏳') + '</div><h2>' + esc(msg) + '</h2></div>');
}

function failState(title, text, alts) {
  var html = '<div class="state"><div class="em">🙁</div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>';
  if (alts && alts.length) {
    html += '<div class="alt-list" style="text-align:left">';
    alts.forEach(function(a) {
      html += '<a class="alt" href="/p/' + encodeURIComponent(CTX.pointId || '') + '/' + encodeURIComponent(a.slug) + '">'
        + '<div class="ic">' + esc(a.icon || '🦴') + '</div><b>' + esc(a.name) + '</b><span>' + fmtPrice(a.fromPrice) + '</span></a>';
    });
    html += '</div>';
  }
  if (CTX.pointId) html += '<button class="link-btn" onclick="location.href=\'/?ref=' + encodeURIComponent(CTX.pointId) + '\'">Весь каталог этой точки</button>';
  html += '</div>';
  state(html);
}

/* ── Загрузка данных ── */
async function boot() {
  var p = parseParams();
  CTX.pointId = p.point; CTX.productSlug = p.product;
  if (!p.point || !p.product) {
    failState('Не получилось открыть товар', 'Ссылка неполная. Попробуйте отсканировать QR-код на упаковке ещё раз.');
    return;
  }
  try {
    var responses = await Promise.all([
      fetch('/api/products', { cache: 'no-store' }),
      fetch('/api/points', { cache: 'no-store' }),
      fetch('/api/points/' + encodeURIComponent(p.point) + '/partners', { cache: 'no-store' })
    ]);
    var res = responses[0];
    if (!res.ok) throw new Error('catalog');
    var pdata = await res.json();
    var products = pdata.products || pdata;
    var pres = responses[1];
    var ptsdata = pres.ok ? await pres.json() : {};
    var points = ptsdata.points || [];
    var partnersRes = responses[2];
    if (!partnersRes.ok) throw new Error('partners');
    var partnersData = await partnersRes.json();
    CTX.partners = Array.isArray(partnersData.partners) ? partnersData.partners : [];
    CTX.point = (points || []).find(function(x) { return x.id === p.point; }) || null;
    if (!CTX.point) {
      state('<div class="state"><div class="em">📍</div><h2>Точка не найдена</h2>'
        + '<p>Возможно, QR-код устарел или точка временно не работает.</p>'
        + '<button class="link-btn" onclick="location.href=\'/\'">Найти другой минимаркет</button></div>');
      return;
    }
    rememberQrPoint(CTX.point);
    var prod = (products || []).find(function(x) { return x.slug === p.product || String(x.id) === String(p.product); });
    if (!prod || prod.active === false) { failState('Товар не найден', 'Возможно, его сняли с продажи.'); return; }
    CTX.product = prod;
    trackGoalOnce('minimarket_selected', 'qr:' + CTX.point.id, {
      scenario: 'qr', selection_mode: 'qr_auto', point_id: CTX.point.id, point_name: CTX.point.name,
    });
    trackGoalOnce('product_opened', 'qr:' + CTX.point.id + ':' + prod.id, {
      scenario: 'qr', product_id: prod.id, product_name: prod.name, point_id: CTX.point.id,
    });

    var chip = document.getElementById('pointChip');
    if (CTX.point) { chip.textContent = '📍 ' + CTX.point.name; chip.style.display = 'block'; }

    CTX.variants = (prod.variants || []).filter(function(v) { return v.active; })
      .map(function(v) { return { id: v.id, weight: v.weight, price: v.price, qty: (v.stock && typeof v.stock[p.point] === 'number') ? v.stock[p.point] : 0 }; });
    var avail = CTX.variants.filter(function(v) { return v.qty > 0; });
    if (!avail.length) {
      var alts = findAlts(products, prod, p.point);
      failState('Сейчас нет на полке', 'Этого товара временно нет в точке' + (CTX.point ? ' «' + CTX.point.name + '»' : '') + '.' + (alts.length ? ' Посмотрите, что есть рядом:' : ''), alts);
      return;
    }
    CTX.selVariant = avail[0];
    var paymentReturn = new URLSearchParams(location.search).get('payment_return');
    if (paymentReturn) {
      handlePaymentReturn(paymentReturn);
      return;
    }
    renderCard();
  } catch (e) {
    failState('Не удалось загрузить', 'Проверьте интернет и обновите страницу.');
  }
}

function findAlts(products, current, pointId) {
  var out = [];
  for (var i = 0; i < products.length && out.length < 2; i++) {
    var pr = products[i];
    if (!pr.active || pr.id === current.id || pr.category !== current.category) continue;
    var best = null;
    (pr.variants || []).forEach(function(v) {
      if (!v.active) return;
      var q = (v.stock && typeof v.stock[pointId] === 'number') ? v.stock[pointId] : 0;
      if (q > 0 && (!best || v.price < best.price)) best = { price: v.price };
    });
    if (best) out.push({ slug: pr.slug, name: pr.name, icon: pr.icon, fromPrice: best.price });
  }
  return out;
}

/* ── Экран 1: карточка товара ── */
function renderCard() {
  var pr = CTX.product, v = CTX.selVariant;
  var comp = [];
  if (Array.isArray(pr.comp)) comp = pr.comp;
  else try { comp = JSON.parse(pr.comp || '[]'); } catch (e) { comp = []; }
  comp = comp.slice(0, 4);

  var html = '<div class="hero"><div class="' + (pr.img ? 'hero-img-wrap' : 'hero-icon') + '">';
  html += pr.img ? '<img class="hero-img" src="' + esc(pr.img) + '" alt="' + esc(pr.name) + '">' : esc(pr.icon || '🦴');
  html += '</div><div class="hero-body">';
  if (pr.badge) html += '<div class="badge">' + esc(pr.badge) + '</div>';
  html += '<h1>' + esc(pr.name) + '</h1>';
  if (pr.desc) html += '<p class="desc">' + esc(pr.desc) + '</p>';
  if (comp.length) html += '<ul class="comp">' + comp.map(function(c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>';

  var avail = CTX.variants.filter(function(x) { return x.qty > 0; });
  if (CTX.variants.length > 1) {
    html += '<div class="variants">' + CTX.variants.map(function(x) {
      var dis = x.qty > 0 ? '' : ' disabled';
      var sel = x.id === v.id ? ' sel' : '';
      return '<button class="variant' + sel + '"' + dis + ' onclick="pickVariant(' + x.id + ')">' + esc(x.weight) + ' · ' + fmtPrice(x.price) + '</button>';
    }).join('') + '</div>';
  }

  html += '<div class="price-row"><div class="price">' + fmtPrice(v.price) + '</div></div>';
  html += '<div class="stock-note' + (v.qty <= 2 ? ' low' : '') + '">' + (v.qty <= 2 ? '⚡ Осталось всего ' + v.qty + ' шт этой фасовки' : 'В наличии на полке') + '</div>';
  html += '<button class="cta" onclick="showPhoneStep()">Купить сейчас →</button>';
  html += '<button class="link-btn" onclick="location.href=\'/?ref=' + encodeURIComponent(CTX.pointId) + '\'">Весь каталог этой точки</button>';
  html += '</div></div>';
  state(html);
}

function pickVariant(id) {
  var v = CTX.variants.find(function(x) { return x.id === id; });
  if (v && v.qty > 0) { CTX.selVariant = v; renderCard(); }
}

/* ── Экран 2: телефон ── */
function showPhoneStep() {
  var v = CTX.selVariant;
  trackGoal('buy_now_clicked', {
    scenario: 'qr', source: 'qr_product', product_id: CTX.product.id,
    variant_id: v.id, price: v.price, point_id: CTX.pointId,
  });
  trackGoal('checkout_started', {
    scenario: 'qr', source: 'qr_product', product_id: CTX.product.id,
    point_id: CTX.pointId, cart_total: v.price, items_count: 1,
  });
  var advisorField = '';
  if (CTX.partners.length > 0) {
    advisorField = '<label for="advisor">Кто посоветовал товар?</label>'
      + '<select id="advisor" class="checkout-select" style="margin-bottom:12px">'
      + '<option value="">Выберите вариант</option>'
      + CTX.partners.map(function(partner) { return '<option value="' + Number(partner.id) + '">' + esc(partner.full_name) + '</option>'; }).join('')
      + '<option value="self">Выбрал всё сам</option></select>';
  }
  state('<div class="panel"><h2>Почти готово</h2>'
    + '<p class="small muted" style="margin-bottom:14px">' + esc(CTX.product.name) + ' · ' + esc(v.weight) + ' · <b>' + fmtPrice(v.price) + '</b>'
    + (CTX.point ? '<br>Забрать: ' + esc(CTX.point.name) + (CTX.point.addr ? ', ' + esc(CTX.point.addr) : '') : '') + '</p>'
    + '<label for="phone">Номер телефона</label>'
    + '<input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="+7 (900) 000-00-00" value="' + esc(knownPhone()) + '">'
    + '<p class="small muted" style="margin-top:6px">Свяжем заказ с вашим номером и начислим косточки-бонусы.</p>'
    + advisorField
    + '<div class="note" style="display:block">📍 Точка уже определена по QR-коду товара. Повторно выбирать её не нужно.</div>'
    + '<button class="cta" id="payBtn" onclick="startPayment()">Оплатить ' + fmtPrice(v.price) + '</button>'
    + '<div class="err" id="err"></div>'
    + '<button class="link-btn" onclick="renderCard()">← Назад к товару</button></div>');
  var inp = document.getElementById('phone');
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
}

function showErr(msg) { var e = document.getElementById('err'); e.textContent = msg; e.style.display = 'block'; }

/* ── Экран 3: оплата ── */
async function startPayment() {
  var phone = normPhone(document.getElementById('phone').value);
  if (!validatePhone(phone || '')) { showErr('Укажите телефон в формате +7 (900) 000-00-00.'); return; }
  var advisorValue = document.getElementById('advisor') ? document.getElementById('advisor').value : '';
  if (CTX.partners.length > 0 && !advisorValue) {
    showErr('Выберите грумера или пункт «Выбрал всё сам».');
    return;
  }
  var selectedPartnerId = advisorValue && advisorValue !== 'self' ? Number(advisorValue) : null;
  rememberPhone(phone);
  var btn = document.getElementById('payBtn');
  btn.disabled = true; btn.textContent = 'Готовим оплату…';

  var orderId = 'TG-' + Date.now();
  var v = CTX.selVariant;
  var funnelKey = 'qr:' + CTX.pointId + ':' + v.id;
  trackGoalOnce('phone_entered', funnelKey, {
    scenario: 'qr', product_id: CTX.product.id, variant_id: v.id, point_id: CTX.pointId,
  });
  trackGoalOnce('checkout_to_payment', funnelKey, {
    scenario: 'qr', product_id: CTX.product.id, variant_id: v.id,
    point_id: CTX.pointId, revenue: v.price, items_count: 1,
  });
  try {
    // Сначала проверяем внешний модуль и только затем резервируем товар.
    // Если модуль заблокирован браузером, используем redirect-оплату.
    var useEmbeddedWidget = await prepareWidget();
    var confirmationMode = useEmbeddedWidget ? 'embedded' : 'redirect';
    var res = await fetch('/api/create-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        orderId: orderId,
        amount: v.price,
        // Способ оплаты клиент выбирает в защищённой форме ЮKassa.
        method: 'yookassa',
        customerPhone: phone,
        customerEmail: null,
        customerName: null,
        customerLname: null,
        pickupPoint: CTX.point ? CTX.point.name + (CTX.point.addr ? ' — ' + CTX.point.addr : '') : '',
        pointId: CTX.pointId,
        partnerId: selectedPartnerId,
        advisorSelection: advisorValue === 'self' ? 'self' : null,
        comment: null,
        bonesUsed: 0,
        fulfillmentType: 'pickup',
        deliveryAddress: null,
        cityId: null,
        referralCode: null,
        confirmationMode: confirmationMode,
        returnPath: location.pathname,
        cartItems: [{ variantId: v.id, qty: 1 }]
      })
    });
    var data = await res.json();
    if (!res.ok) throw new Error((data && data.error) || 'Не удалось создать заказ');

    trackGoalOnce('payment_created', orderId, {
      scenario: 'qr', order_id: orderId, product_id: CTX.product.id,
      variant_id: v.id, point_id: CTX.pointId, revenue: v.price,
      confirmation_mode: confirmationMode,
    });

    if (data.demo === true) { showSuccess(orderId, phone); return; }

    if (!data.confirmation_token) {
      if (confirmationMode === 'redirect' && data.confirmation_url) {
        btn.textContent = 'Открываем безопасную оплату…';
        location.assign(data.confirmation_url);
        return;
      }
      throw new Error((data && data.error) || 'Не удалось открыть форму оплаты');
    }

    btn.style.display = 'none';
    var noteEl = document.createElement('div');
    noteEl.className = 'note'; noteEl.id = 'payNote';
    noteEl.style.display = 'block';
    noteEl.textContent = '🔒 Товар зарезервирован на ' + (data.reservation_minutes || 15) + ' минут. Завершите оплату в этом окне.';
    btn.parentNode.insertBefore(noteEl, btn.nextSibling);
    var box = document.createElement('div');
    box.id = 'yk-box'; box.style.display = 'block';
    btn.parentNode.insertBefore(box, noteEl.nextSibling);

    var finished = false;
    var stopTimer = null;
    var checkout = new window.YooMoneyCheckoutWidget({
      confirmation_token: data.confirmation_token,
      return_url: location.href.split('?')[0],
      error_callback: function() { showErr('⚠️ Ошибка инициализации оплаты, попробуйте ещё раз.'); }
    });
    CTX.checkout = checkout;

    async function checkStatus() {
      try {
        var r = await fetch('/api/payment-status/' + encodeURIComponent(data.payment_id), { cache: 'no-store' });
        if (!r.ok) return;
        var st = await r.json();
        if (finished) return;
        if (st.paid) { finished = true; if (stopTimer) clearInterval(stopTimer); try { checkout.destroy(); } catch (e) {} showSuccess(orderId, phone); }
        else if (st.status === 'failed' || st.status === 'canceled') {
          finished = true; if (stopTimer) clearInterval(stopTimer); try { checkout.destroy(); } catch (e) {}
          box.style.display = 'none';
          noteEl.textContent = 'Оплата не прошла. Можно безопасно попробовать оплатить заказ заново.';
          btn.style.display = 'block'; btn.disabled = false; btn.textContent = 'Оплатить ' + fmtPrice(v.price);
          trackGoalOnce('payment_cancelled', orderId, {
            scenario: 'qr', order_id: orderId, status: st.status, revenue: v.price,
          });
        }
      } catch (e) { /* временный сбой — опрос продолжится */ }
    }

    checkout.on('success', function() {
      noteEl.textContent = '⏳ Подтверждаем оплату на сервере. Не закрывайте страницу…';
      checkStatus();
    });
    checkout.on('fail', function() {
      noteEl.textContent = 'Оплата не прошла. Попробуйте ещё раз.';
      trackGoalOnce('payment_cancelled', orderId, {
        scenario: 'qr', order_id: orderId, status: 'widget_fail', revenue: v.price,
      });
    });
    await checkout.render('yk-box');
    checkStatus();
    stopTimer = setInterval(checkStatus, 2500);
  } catch (e) {
    console.error('Не удалось запустить оплату:', e);
    showErr('Не удалось открыть оплату. Проверьте интернет и попробуйте ещё раз.');
    trackGoal('payment_create_error', { scenario: 'qr', order_id: orderId, point_id: CTX.pointId });
    btn.disabled = false; btn.textContent = 'Оплатить ' + fmtPrice(v.price);
  }
}

/* ── Экран 4: успех ── */
function showSuccess(orderId, phone) {
  SUCCESS_PHONE = phone || '';
  SUCCESS_ORDER_ID = orderId || '';
  trackGoalOnce('payment_success', orderId, {
    scenario: 'qr', order_id: orderId, product_id: CTX.product.id,
    variant_id: CTX.selVariant.id, point_id: CTX.pointId, revenue: CTX.selVariant.price,
  });
  trackGoalOnce('purchase', orderId, {
    order_id: orderId, revenue: CTX.selVariant.price, payment_method: 'yookassa', scenario: 'qr',
  });
  state('<div class="panel success"><div class="big">✅</div>'
    + '<h2>Оплачено</h2>'
    + '<div class="take-product">Возьмите товар с полки</div>'
    + '<p>Обращаться к сотруднику не нужно.</p>'
    + '<div class="success-product"><b>' + esc(CTX.product.name) + '</b><span>' + esc(CTX.selVariant.weight) + ' · 1 шт.</span></div>'
    + (CTX.point ? '<p class="small" style="margin-top:12px">📍 ' + esc(CTX.point.name) + (CTX.point.addr ? '<br>' + esc(CTX.point.addr) : '') + '</p>' : '')
    + '<div class="order-code">Заказ ' + esc(orderId) + '</div>'
    + (phone ? '<p class="small" style="margin-top:14px">Заказ привязан к номеру ' + esc(phone) + '.<br>Косточки-бонусы начислятся на этот номер.</p>' : '')
    + '<button class="link-btn" onclick="location.href=\'/?page=account&open_orders=1\'">Открыть мой заказ</button>'
    + '<div class="notify-title">Получать уведомления о заказах</div>'
    + '<div class="notify-grid">'
    + '<div class="notify-card" id="successMaxCard" style="display:none;background:#F5F1FF;border-color:#D9CBFF"><b>MAX</b>Статусы следующих заказов<button id="successMaxBtn" style="background:#7C4DFF" onclick="connectSuccessChannel(\'max\')">Подключить MAX</button><div class="notify-status" id="successMaxStatus"></div></div>'
    + '<div class="notify-card" id="successTelegramCard" style="background:#EEF6FF;border-color:#B8D8F8"><b>Telegram</b>Статусы следующих заказов<button id="successTelegramBtn" style="background:#229ED9" onclick="connectSuccessChannel(\'telegram\')">Подключить Telegram</button><div class="notify-status" id="successTelegramStatus"></div></div>'
    + '</div>'
    + '<button class="cta" style="margin-top:18px" onclick="location.href=\'/?ref=' + encodeURIComponent(CTX.pointId) + '\'">Купить ещё товар</button>'
    + '</div>');
  initSuccessNotifications(phone);
}

async function initSuccessNotifications(phone) {
  if (!validatePhone(normPhone(phone || '') || '')) {
    var tg = document.getElementById('successTelegramCard');
    if (tg) tg.style.display = 'none';
    return;
  }
  var digits = String(phone).replace(/\D/g,'').slice(-10);
  if (localStorage.getItem('hvostmarket_tg_connected_phone') === digits) markSuccessChannelConnected('telegram', phone);
  try {
    var res = await fetch('/api/customer/max/status', { cache:'no-store' });
    var data = await res.json();
    var card = document.getElementById('successMaxCard');
    if (card && res.ok && data.enabled) card.style.display = 'block';
    if (res.ok && data.enabled && localStorage.getItem('hvostmarket_max_connected_phone') === digits) markSuccessChannelConnected('max', phone);
  } catch (e) { /* MAX просто не показываем */ }
}

function markSuccessChannelConnected(channel, phone) {
  var prefix = channel === 'max' ? 'Max' : 'Telegram';
  var btn = document.getElementById('success' + prefix + 'Btn');
  var status = document.getElementById('success' + prefix + 'Status');
  var digits = String(phone || '').replace(/\D/g,'').slice(-10);
  if (digits) localStorage.setItem(channel === 'max' ? 'hvostmarket_max_connected_phone' : 'hvostmarket_tg_connected_phone', digits);
  if (btn) btn.style.display = 'none';
  if (status) { status.textContent = '✓ Подключено'; status.style.color = '#2D7D46'; status.style.fontWeight = '700'; }
}

async function connectSuccessChannel(channel) {
  var phone = SUCCESS_PHONE;
  var prefix = channel === 'max' ? 'Max' : 'Telegram';
  var btn = document.getElementById('success' + prefix + 'Btn');
  var status = document.getElementById('success' + prefix + 'Status');
  if (btn) { btn.disabled = true; btn.textContent = 'Создаём ссылку…'; }
  var popup = window.open('', '_blank');
  try {
    var res = await fetch('/api/customer/' + channel + '/start', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone:phone}) });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Не удалось создать ссылку');
    if (popup) popup.location.href = data.deep_link;
    if (status) status.textContent = 'Подтвердите номер в приложении…';
    var attempts = 0;
    var timer = setInterval(async function() {
      attempts++;
      try {
        var check = await fetch('/api/customer/' + channel + '/check?token=' + encodeURIComponent(data.token));
        var result = await check.json();
        if (result.verified && result.token) {
          clearInterval(timer);
          localStorage.setItem('taiga_customer_token', result.token);
          markSuccessChannelConnected(channel, phone);
          trackGoalOnce('notifications_connected', channel + ':' + (SUCCESS_ORDER_ID || 'qr'), {
            scenario: 'qr', channel: channel, order_id: SUCCESS_ORDER_ID,
          });
        } else if (!check.ok || attempts >= 150) {
          clearInterval(timer);
          if (btn) { btn.disabled = false; btn.textContent = 'Попробовать снова'; }
          if (status) status.textContent = 'Подтверждение не получено.';
        }
      } catch (e) { /* повторим */ }
    }, 2000);
  } catch (e) {
    if (popup) popup.close();
    if (btn) { btn.disabled = false; btn.textContent = 'Попробовать снова'; }
    if (status) status.textContent = e.message;
  }
}

async function handlePaymentReturn(orderCode) {
  var cleanUrl = new URL(location.href);
  cleanUrl.searchParams.delete('payment_return');
  history.replaceState({}, '', cleanUrl.pathname + (cleanUrl.searchParams.toString() ? '?' + cleanUrl.searchParams.toString() : ''));
  loadState('Подтверждаем оплату…', '⏳');

  for (var attempt = 0; attempt < 15; attempt += 1) {
    try {
      var response = await fetch('/api/order-payment-status/' + encodeURIComponent(orderCode), { cache:'no-store' });
      var result = await response.json();
      if (response.ok && result.paid) {
        showSuccess(result.order_code || orderCode, knownPhone() === '+7' ? '' : knownPhone());
        return;
      }
      if (response.ok && (result.status === 'failed' || result.status === 'canceled')) {
        trackGoalOnce('payment_cancelled', orderCode, {
          scenario: 'qr', order_id: orderCode, status: result.status,
        });
        failState('Оплата не прошла', 'Товар снова доступен. Попробуйте оплатить ещё раз.');
        return;
      }
    } catch (e) { /* временный сетевой сбой — повторяем */ }
    await new Promise(function(resolve) { setTimeout(resolve, 2000); });
  }

  state('<div class="state"><div class="em">⏳</div><h2>Платёж ещё обрабатывается</h2>'
    + '<p>Подождите немного и проверьте результат ещё раз.</p>'
    + '<button class="cta" id="retryPaymentStatus" style="margin-top:18px">Проверить оплату</button></div>');
  document.getElementById('retryPaymentStatus').onclick = function() { handlePaymentReturn(orderCode); };
}

boot();
</script>
</body>
</html>
